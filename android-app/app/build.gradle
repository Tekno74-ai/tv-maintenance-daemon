plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tekno74.tvmaintenance'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tekno74.tvmaintenance'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '3.0.0'
    }

    flavorDimensions += 'edition'
    productFlavors {
        community {
            dimension 'edition'
        }
        if (project.hasProperty('personalOverlayDir')) {
            personal {
                dimension 'edition'
            }
        }
    }

    if (project.hasProperty('personalOverlayDir')) {
        def overlayDir = file(project.property('personalOverlayDir'))
        sourceSets {
            personal {
                manifest.srcFile new File(overlayDir, 'AndroidManifest.xml')
                java.srcDirs = [new File(overlayDir, 'java')]
                res.srcDirs = [new File(overlayDir, 'res')]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB; signed with debug key for deterministic updates.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
